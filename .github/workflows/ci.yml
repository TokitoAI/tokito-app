name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linux only, on a GitHub-hosted runner.
  #
  # The self-hosted VPS runner is being decommissioned, and the Windows leg was
  # pointed at `tokito-windows` — the org's only Windows runner, which is
  # offline, so that half of the matrix has been queuing indefinitely rather
  # than reporting. Windows is for the desktop app; this crate is the mobile
  # companion's Rust core and is consumed by Android and iOS, not Windows.
  rust:
    name: rust (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@98e1b82157cd469e843cb7f524c1313b4ad9492c # 1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: UniFFI Kotlin generate smoke
        run: bash scripts/generate-bindings.sh

  mobile:
    name: mobile (typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run release:validate
      - run: npx expo install --check
      - run: npx expo-doctor
      - run: npm run audit:test
      - run: npm run audit
      - run: npm run forbid-js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
