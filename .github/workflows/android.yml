name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install compile SDK and native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          validate-wrappers: true
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload debug evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tokito-physical-runtime-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
            voice-runtime/build/reports/lint-results-debug.html
            voice-runtime/build/reports/tests/testDebugUnitTest/
            voice-runtime/build/test-results/testDebugUnitTest/
            dialogue-runtime/build/outputs/aar/dialogue-runtime-debug.aar
            dialogue-runtime/build/reports/lint-results-debug.html
            dialogue-runtime/build/reports/tests/testDebugUnitTest/
            dialogue-runtime/build/test-results/testDebugUnitTest/
            measurement-runtime/build/reports/lint-results-debug.html
            measurement-runtime/build/reports/tests/testDebugUnitTest/
            measurement-runtime/build/test-results/testDebugUnitTest/
            android/runtime/build/reports/lint-results-debug.html
            android/runtime/build/reports/tests/testDebugUnitTest/
            android/ar-runtime/build/reports/lint-results-debug.html
            android/ar-runtime/build/reports/tests/testDebugUnitTest/
            android/ar-demo/build/outputs/apk/debug/ar-demo-debug.apk
