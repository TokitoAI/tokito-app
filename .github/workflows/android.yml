name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android tests, lint, and debug assembly
    runs-on: [self-hosted, Linux, X64, tokito-vps, private-build]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :android:runtime:testDebugUnitTest \
            :android:ar-runtime:testDebugUnitTest \
            :android:ar-demo:lintDebug \
            :android:ar-demo:assembleDebug

      - name: Upload AR conformance APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tokito-ar-conformance-debug
          path: android/ar-demo/build/outputs/apk/debug/ar-demo-debug.apk
          if-no-files-found: error
          retention-days: 14
