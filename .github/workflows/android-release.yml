name: android-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to build (for example v0.2.1-pre.1)
        required: true
        type: string
  push:
    tags:
      - "v*-pre*"
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

# Keep UniFFI and Gradle in separate jobs so the hardened runner cleanup hook
# removes each workspace before the next build stage. Android SDK/NDK and tool
# caches live outside the repository workspace and remain reusable.

jobs:
  build-ffi:
    name: UniFFI Android .so + Kotlin
    runs-on: [self-hosted, Linux, X64, tokito-vps, private-build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate dispatched release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$(git rev-parse HEAD)" = "$tag_commit"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Build UniFFI Android .so + Kotlin bindings
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TOKITO_ANDROID_TARGETS: arm64-v8a
        run: bash scripts/build-android-ffi.sh

      - name: Stage UniFFI artifacts
        run: |
          set -euo pipefail
          STAGE="${GITHUB_WORKSPACE}/ffi-stage"
          SRC="apps/mobile/modules/tokito-companion-ffi/android/src/main"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a "$SRC/jniLibs" "$STAGE/"
          cp -a "$SRC/java/uniffi" "$STAGE/"
          find "$STAGE" -name 'libtokito_companion_ffi.so' | tee /tmp/so-list.txt
          test -s /tmp/so-list.txt
          test -d "$STAGE/uniffi"

      - name: Upload UniFFI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokito-companion-ffi-android
          path: ffi-stage/
          if-no-files-found: error
          retention-days: 2

  build-release:
    name: release APK + AAB (upload-signed)
    needs: build-ffi
    runs-on: [self-hosted, Linux, X64, tokito-vps, private-build]
    environment: production
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Download UniFFI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tokito-companion-ffi-android
          path: ffi-stage

      - name: Install UniFFI into Expo module
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          DEST="apps/mobile/modules/tokito-companion-ffi/android/src/main"
          mkdir -p "$DEST/jniLibs" "$DEST/java"
          rm -rf "$DEST/jniLibs" "$DEST/java/uniffi"
          cp -a ffi-stage/jniLibs "$DEST/"
          cp -a ffi-stage/uniffi "$DEST/java/"
          find "$DEST/jniLibs" -name 'libtokito_companion_ffi.so' | tee /tmp/so-list.txt
          test -s /tmp/so-list.txt
          test -d "$DEST/java/uniffi"
          df -h

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install npm deps
        run: npm ci

      - name: Validate Expo dependency graph
        run: |
          npx expo install --check
          npx expo-doctor
          npm audit --audit-level=high

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Limit React Native ABIs to arm64-v8a
        run: |
          if grep -q '^reactNativeArchitectures=' android/gradle.properties 2>/dev/null; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          else
            echo 'reactNativeArchitectures=arm64-v8a' >> android/gradle.properties
          fi
          grep reactNativeArchitectures android/gradle.properties

      - name: Configure Play-quality release signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: node scripts/configure-android-release.mjs

      - name: Assemble release APK + bundle AAB
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: |
          df -h
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
        timeout-minutes: 45

      - name: Stage artifacts
        id: stage
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n1)
          test -n "$APK"
          test -n "$AAB"
          TAG_SAFE="${{ inputs.release_tag || github.ref_name }}"
          APK_OUT="${GITHUB_WORKSPACE}/TokitoCompanion-${TAG_SAFE}.apk"
          AAB_OUT="${GITHUB_WORKSPACE}/TokitoCompanion-${TAG_SAFE}.aab"
          cp "$APK" "$APK_OUT"
          cp "$AAB" "$AAB_OUT"
          cp "$APK" "${GITHUB_WORKSPACE}/tokito-companion.apk"
          cp "$AAB" "${GITHUB_WORKSPACE}/tokito-companion.aab"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_OUT" >> "$GITHUB_OUTPUT"

          unzip -l "$APK_OUT" | grep -E 'index.android.bundle|assets/index' || {
            echo "ERROR: JS bundle not packaged in APK"
            exit 1
          }
          unzip -l "$APK_OUT" | grep -E 'libtokito_companion_ffi\.so' || {
            echo "ERROR: UniFFI native library missing from APK"
            exit 1
          }

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs "$APK_OUT" | tee /tmp/apk-certs.txt
          if grep -qi 'CN=Android Debug' /tmp/apk-certs.txt; then
            echo "ERROR: APK is still debug-signed"
            exit 1
          fi
          ls -lh "$APK_OUT" "$AAB_OUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokito-companion-release
          path: |
            tokito-companion.apk
            tokito-companion.aab
          if-no-files-found: error

      - name: Create GitHub pre-release / release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          PRERELEASE_ARGS=()
          if [[ "$TAG" == *"-pre"* || "$TAG" == *"-rc"* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi
          NOTES="$(cat <<EOF
          ## Tokito Companion \`${TAG}\`

          Play-quality **upload-signed** build (same keystore track as Play Console uploads).
          Cloud: **\`https://api.tokito.dev\`** (tokito-ai) via UniFFI.

          | Artifact | Use |
          |---|---|
          | \`TokitoCompanion-${TAG}.apk\` | Direct install / QA sideload |
          | \`TokitoCompanion-${TAG}.aab\` | Google Play upload |

          | | |
          |---|---|
          | Package | \`dev.tokito.companion\` |
          | Native | \`libtokito_companion_ffi.so\` (UniFFI, arm64-v8a) |
          | Bundle | embedded \`index.android.bundle\` |
          | Signing | upload keystore (not Android Debug) |

          Uninstall older debug-signed Companion builds before installing — signature changes.

          EOF
          )"
          gh release create "$TAG" \
            "${PRERELEASE_ARGS[@]}" \
            --title "Tokito Companion ${TAG}" \
            --notes "$NOTES" \
            "TokitoCompanion-${TAG}.apk" \
            "TokitoCompanion-${TAG}.aab"
