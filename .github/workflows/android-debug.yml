name: android-debug

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-pre*"
      - "v*-debug*"

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: assembleRelease APK (UniFFI + sideload)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Build UniFFI Android .so + Kotlin bindings
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TOKITO_ANDROID_TARGETS: arm64-v8a,armeabi-v7a,x86_64
        run: bash scripts/build-android-ffi.sh

      - name: Install npm deps
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Patch release signing for sideload
        run: node scripts/patch-android-release.mjs

      - name: Assemble release APK (embeds JS bundle + UniFFI)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$SRC"
          DEST="${GITHUB_WORKSPACE}/tokito-companion-debug.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          unzip -l "$DEST" | grep -E 'index.android.bundle|assets/index' || {
            echo "ERROR: JS bundle not packaged in APK"
            unzip -l "$DEST" | head -80
            exit 1
          }
          unzip -l "$DEST" | grep -E 'libtokito_companion_ffi\.so' || {
            echo "ERROR: UniFFI native library missing from APK"
            unzip -l "$DEST" | rg 'lib/|\.so' | head -80 || true
            exit 1
          }
          ls -lh "$DEST"

      - uses: actions/upload-artifact@v4
        with:
          name: tokito-companion-debug-apk
          path: tokito-companion-debug.apk
          if-no-files-found: error

      - name: Create GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(cat <<EOF
          ## Tokito Companion APK (pre-release)

          Sideload this APK on Android/tablet (enable install from unknown sources).

          - Package: \`dev.tokito.companion\`
          - Cloud: \`https://api.tokito.dev\` via **UniFFI Rust** (\`libtokito_companion_ffi.so\`)
          - Build: **release** with embedded JS bundle (no Metro) + native cloud client
          - UI: Tokito desktop tokens (mint/indigo), brand tile, Phosphor icons, tablet split view

          EOF
          )"
          gh release create "$TAG" \
            --prerelease \
            --title "Tokito Companion ${TAG}" \
            --notes "$NOTES" \
            tokito-companion-debug.apk

      - name: Create floating pre-release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG="debug-latest"
          NOTES="$(cat <<EOF
          ## Tokito Companion APK

          Floating pre-release from \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`.

          **Release APK** with embedded \`index.android.bundle\` + UniFFI \`libtokito_companion_ffi.so\`.

          Package: \`dev.tokito.companion\`.

          EOF
          )"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" tokito-companion-debug.apk --clobber
            gh release edit "$TAG" --prerelease --notes "$NOTES" --title "Tokito Companion debug (latest)"
          else
            gh release create "$TAG" \
              --prerelease \
              --title "Tokito Companion debug (latest)" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              tokito-companion-debug.apk
          fi
