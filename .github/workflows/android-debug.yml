name: android-debug

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-pre*"
      - "v*-debug*"

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: assembleRelease APK (UniFFI + sideload)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Build UniFFI Android .so + Kotlin bindings
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          TOKITO_ANDROID_TARGETS: arm64-v8a,armeabi-v7a,x86_64
        run: bash scripts/build-android-ffi.sh

      - name: Install npm deps
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Patch release signing for sideload
        run: node scripts/patch-android-release.mjs

      - name: Assemble release APK (embeds JS bundle + UniFFI)
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          # Avoid Gradle daemon hanging forever on GHA
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode=all
        timeout-minutes: 45

      - name: Stage APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$SRC"
          TAG_SAFE="${GITHUB_REF_NAME:-local}"
          DEST="${GITHUB_WORKSPACE}/TokitoCompanion-${TAG_SAFE}.apk"
          # Also keep a stable filename for artifact upload
          cp "$SRC" "$DEST"
          cp "$SRC" "${GITHUB_WORKSPACE}/tokito-companion.apk"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "stable=${GITHUB_WORKSPACE}/tokito-companion.apk" >> "$GITHUB_OUTPUT"
          unzip -l "$DEST" | grep -E 'index.android.bundle|assets/index' || {
            echo "ERROR: JS bundle not packaged in APK"
            unzip -l "$DEST" | head -80
            exit 1
          }
          unzip -l "$DEST" | grep -E 'libtokito_companion_ffi\.so' || {
            echo "ERROR: UniFFI native library missing from APK"
            unzip -l "$DEST" | rg 'lib/|\.so' | head -80 || true
            exit 1
          }
          ls -lh "$DEST"

      - uses: actions/upload-artifact@v4
        with:
          name: tokito-companion-apk
          path: tokito-companion.apk
          if-no-files-found: error

      - name: Create GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="TokitoCompanion-${TAG}.apk"
          NOTES="$(cat <<EOF
          ## Tokito Companion \`${TAG}\`

          **Install this APK** (sideload). Uninstall any older Companion build first.

          | | |
          |---|---|
          | Package | \`dev.tokito.companion\` |
          | Version | \`${TAG}\` |
          | Cloud | \`https://api.tokito.dev\` via **UniFFI** (\`libtokito_companion_ffi.so\`) |
          | Bundle | embedded \`index.android.bundle\` (no Metro) |
          | Signing | debug keystore (sideload only — not Play Store) |

          ### Do not use older tags
          Pre-\`v0.1.2\` APKs lacked UniFFI and/or the JS bundle. Use **this** release only.

          EOF
          )"
          gh release create "$TAG" \
            --prerelease \
            --title "Tokito Companion ${TAG}" \
            --notes "$NOTES" \
            "$ASSET"

      # workflow_dispatch: upload artifact only — no floating debug-latest tag/release
      - name: Note (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual run complete. Download the tokito-companion-apk artifact."
          echo "For a tracked install, push a version tag: v0.1.2-pre.N"