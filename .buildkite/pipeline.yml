env:
  CI_IMAGE: "ghcr.io/tokitoai/tokito-ci-mobile@sha256:67bd10c8dab6d208c37feece035ee6b9e5778c98d50270e79b806a62d640caa4"

agents:
  queue: "${TOKITO_CI_QUEUE:-linux}"

steps:
  - label: ":rust: Rust + UniFFI"
    key: rust
    command: .buildkite/steps/rust.sh
    timeout_in_minutes: 25

  - label: ":typescript: mobile"
    key: mobile
    command: .buildkite/steps/mobile.sh
    timeout_in_minutes: 20

  - label: ":test_tube: physical contracts"
    key: physical-contracts
    command: .buildkite/steps/physical-contracts.sh
    timeout_in_minutes: 25

  - label: ":android: physical Android"
    key: physical-android
    command: .buildkite/steps/physical-android.sh
    timeout_in_minutes: 40

  - label: ":android: unified arm64 APK"
    key: unified-android
    command: .buildkite/steps/unified-android.sh
    depends_on:
      - rust
      - mobile
      - physical-contracts
      - physical-android
    timeout_in_minutes: 60
    artifact_paths:
      - "ci-out/tokito-app-release-unsigned-arm64.apk"
      - "ci-out/tokito-app-r8-mapping.txt"
