[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coroutines = "1.10.2"
sherpaOnnx = "1.13.6"
genieX = "0.3.1"
appcompat = "1.7.1"
material = "1.13.0"
lifecycle = "2.9.4"
junit = "4.13.2"
androidx-test = "1.7.0"
espresso = "3.7.0"
json = "20250517"
liteRt = "2.2.0"

[libraries]
sherpa-onnx = { group = "com.k2fsa.sherpa.onnx", name = "sherpa-onnx", version.ref = "sherpaOnnx" }
geniex-android = { group = "com.qualcomm.qti", name = "geniex-android", version.ref = "genieX" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
