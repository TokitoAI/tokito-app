[package]
name = "tokito-companion-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UniFFI + blocking facade over tokito-companion-core for React Native"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "tokito_companion_ffi"

[dependencies]
tokito-companion-core = { path = "../core" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
thiserror.workspace = true
uniffi = { version = "0.29.5", features = ["cli"] }
serde_json.workspace = true
sha2 = "0.10"
uuid.workspace = true

[build-dependencies]
uniffi = { version = "0.29.5", features = ["build"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[[bin]]
# `cargo run -p tokito-companion-ffi --bin uniffi-bindgen` for scaffolding/bindings.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
